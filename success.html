<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đặt hàng - Lo Trưa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; scroll-behavior: smooth; }
        .gradient-orange { background: linear-gradient(135deg, #ff8c00 0%, #ed8936 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 shadow-sm border-b border-orange-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-orange-600 tracking-tighter italic">LO TRƯA.</a>
            <a href="index.html#pricing" class="text-xs font-bold uppercase tracking-wide text-slate-500 hover:text-orange-500 transition">Xem combo</a>
        </div>
    </nav>

    <main class="pt-32 pb-16 px-6">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-xl px-8 py-12 text-center">
                <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 text-3xl">✓</div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-3">Xác nhận đặt hàng thành công</h1>
                <p class="text-base text-slate-600 mb-8">
                    Lo Trưa sẽ liên hệ lại bạn trong vòng <span class="font-semibold text-orange-600">12 giờ</span> tới.
                </p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <a href="index.html" class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold hover:bg-slate-100 transition">Về trang chủ</a>
                    <a href="order.html" class="px-6 py-3 rounded-xl font-bold text-white gradient-orange shadow-lg shadow-orange-200">Đặt thêm đơn khác</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ORDER_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxC7JMZHPM-Ul3f03wnzZ-ovrZNtyst2iFANTdSME2RzlG71rDWecrKv3rq6jzavF-uGw/exec';
        const ORDER_PAYLOAD_KEY = 'lotrua_order_payload';
        const ORDER_SENT_KEY = 'lotrua_order_sent';

        async function sendOrderToSheet(payload) {
            const response = await fetch(ORDER_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error('Failed to send order data');
            }
        }

        function shouldSendOrder(orderId) {
            if (!orderId) {
                return false;
            }
            if (localStorage.getItem(`lotrua_order_sent_${orderId}`)) {
                return false;
            }
            if (sessionStorage.getItem(ORDER_SENT_KEY) === orderId) {
                return false;
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const rawPayload = sessionStorage.getItem(ORDER_PAYLOAD_KEY);
            if (!rawPayload) {
                return;
            }

            let payload;
            try {
                payload = JSON.parse(rawPayload);
            } catch (error) {
                console.error('Invalid order payload', error);
                return;
            }

            if (!shouldSendOrder(payload.order_id)) {
                return;
            }

            sessionStorage.setItem(ORDER_SENT_KEY, payload.order_id);

            sendOrderToSheet(payload)
                .then(() => {
                    localStorage.setItem(`lotrua_order_sent_${payload.order_id}`, 'true');
                    sessionStorage.removeItem(ORDER_PAYLOAD_KEY);
                })
                .catch((error) => {
                    console.error('Unable to send order payload', error);
                });
        });
    </script>
</body>
</html>
