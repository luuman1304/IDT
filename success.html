<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đặt hàng - Lo Trưa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; scroll-behavior: smooth; }
        .gradient-orange { background: linear-gradient(135deg, #ff8c00 0%, #ed8936 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 shadow-sm border-b border-orange-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-orange-600 tracking-tighter italic">LO TRƯA.</a>
            <a href="index.html#pricing" class="text-xs font-bold uppercase tracking-wide text-slate-500 hover:text-orange-500 transition">Xem combo</a>
        </div>
    </nav>

    <main class="pt-32 pb-16 px-6">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-xl px-8 py-12 text-center">
                <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 text-3xl">✓</div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-3">Xác nhận đặt hàng thành công</h1>
                <p class="text-base text-slate-600 mb-8">
                    Lo Trưa sẽ liên hệ lại bạn trong vòng <span class="font-semibold text-orange-600">12 giờ</span> tới.
                </p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <a href="index.html" class="px-6 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold hover:bg-slate-100 transition">Về trang chủ</a>
                    <a href="order.html" class="px-6 py-3 rounded-xl font-bold text-white gradient-orange shadow-lg shadow-orange-200">Đặt thêm đơn khác</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxC7JMZHPM-Ul3f03wnzZ-ovrZNtyst2iFANTdSME2RzlG71rDWecrKv3rq6jzavF-uGw/exec';
        const ORDER_PAYLOAD_KEY = 'lotrua_order_payload';
        const ORDER_ID_KEY = 'order_id';

        function getUTM() {
            const params = new URLSearchParams(window.location.search);
            return {
                utm_source: params.get('utm_source') || '',
                utm_medium: params.get('utm_medium') || '',
                utm_campaign: params.get('utm_campaign') || '',
                page_url: window.location.href
            };
        }

        function normalizeOrderTime(orderTime) {
            if (!orderTime) {
                return new Date().toISOString();
            }
            const parsed = new Date(orderTime);
            if (Number.isNaN(parsed.getTime())) {
                return new Date().toISOString();
            }
            return parsed.toISOString();
        }

        function generateOrderId() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const rand = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
            return `LT-${yyyy}${mm}${dd}-${rand}`;
        }

        function resolveOrderId(storedPayload) {
            const sessionOrderId = sessionStorage.getItem(ORDER_ID_KEY);
            if (sessionOrderId) {
                return sessionOrderId;
            }
            if (storedPayload && storedPayload.order_id) {
                return storedPayload.order_id;
            }
            const params = new URLSearchParams(window.location.search);
            const queryOrderId = params.get('order_id');
            if (queryOrderId) {
                return queryOrderId;
            }
            return generateOrderId();
        }

        function buildPayload() {
            const storedPayload = sessionStorage.getItem(ORDER_PAYLOAD_KEY);
            if (storedPayload) {
                try {
                    const parsed = JSON.parse(storedPayload);
                    return {
                        ...parsed,
                        order_id: resolveOrderId(parsed),
                        order_time: normalizeOrderTime(parsed.order_time),
                        tracking: getUTM()
                    };
                } catch (error) {
                    console.warn('Invalid stored payload, falling back to page data.', error);
                }
            }

            const orderId = resolveOrderId();

            return {
                order_id: orderId,
                order_time: new Date().toISOString(),
                package: window.package || { type: '', days: 0, price_per_day: 0, total_price: 0 },
                schedule: window.schedule || { from_date: '', to_date: '', include_weekend: false },
                addons: window.addons || [],
                customer: window.customer || { full_name: '', phone: '', email: '' },
                delivery: window.delivery || { address: '', district: '', ward: '', note: '' },
                tracking: getUTM()
            };
        }

        async function sendToSheet(payload) {
            const sentKey = `lt_sent_${payload.order_id}`;
            if (!payload.order_id) {
                console.warn('Missing order_id, skip sending.');
                return;
            }
            if (localStorage.getItem(sentKey) === '1') {
                console.log('Already sent:', payload.order_id);
                return;
            }

            const doSend = async () => {
                const body = new URLSearchParams({
                    data: JSON.stringify(payload)
                });
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body
                });
            };

            try {
                await doSend();
                localStorage.setItem(sentKey, '1');
            } catch (error) {
                console.warn('Webhook failed, retry in 2s...', error);
                await new Promise((resolve) => setTimeout(resolve, 2000));
                await doSend();
                localStorage.setItem(sentKey, '1');
            }
        }

        function initOnSuccessPageLoad() {
            const payload = buildPayload();

            sendToSheet(payload).catch((error) => {
                console.error('Unable to send order payload', error);
            });
        }

        document.addEventListener('DOMContentLoaded', initOnSuccessPageLoad);
    </script>
</body>
</html>
